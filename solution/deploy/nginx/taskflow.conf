# ============================================================================
# Configuration du conteneur "proxy" (Nginx) : l'unique point d'entrée de la prod.
# Il parle HTTPS avec le navigateur et transmet le trafic au conteneur "front".
#
# Ce fichier est copié dans ~/taskflow-prod/nginx/ et monté dans le conteneur sur
# /etc/nginx/conf.d/default.conf par compose.prod.yaml.
#
# Après modification : docker compose -f compose.prod.yaml exec proxy nginx -t
# (TOUJOURS tester la syntaxe) puis ... exec proxy nginx -s reload (sans coupure).
#
# Le certificat est généré par deploy/gen-cert.sh (auto-signé, pour le lab).
# Avec un vrai nom de domaine, on utiliserait Let's Encrypt (certbot) à la place.
# ============================================================================

# ---------- Port 80 (HTTP) : on redirige tout vers HTTPS -----------------------
server {
    listen 80;
    server_name taskflow.localhost localhost;

    # Page de santé réservée au healthcheck Docker (pas de redirection ici)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 301 = redirection permanente vers la version HTTPS ($host = le nom demandé).
    # Limite du lab : si vous publiez HTTPS sur un port non standard (HTTPS_PORT=8444),
    # la redirection pointe vers le port 443 par défaut ; ouvrez alors directement
    # https://taskflow.localhost:8444.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Port 443 (HTTPS) : le vrai site -------------------------------------
server {
    listen 443 ssl;
    server_name taskflow.localhost localhost;

    # Certificat et clé privée, montés depuis ./certs (voir compose.prod.yaml)
    ssl_certificate     /etc/nginx/certs/taskflow.crt;
    ssl_certificate_key /etc/nginx/certs/taskflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # "front" est le nom du service dans compose.prod.yaml : le réseau de Compose le
    # traduit en adresse IP. Nginx ne fait cette traduction qu'AU DÉMARRAGE (ou au
    # rechargement) : après un redéploiement du front (nouveau conteneur, parfois nouvelle
    # IP), il faut donc recharger Nginx. C'est ce que fait deploy.sh (nginx -s reload).
    location / {
        proxy_pass http://front:80;

        # En-têtes qui permettent à l'application de connaître le client réel :
        # sans eux, elle ne verrait que l'adresse interne du proxy.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
