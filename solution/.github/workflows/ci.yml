# ============================================================================
# ci.yml : Intégration Continue (CI)
#
# À chaque Pull Request et à chaque push sur main, on vérifie automatiquement que
# le code est propre (lint), fonctionne (tests) et se construit (build).
# Si un job échoue, la PR affiche une croix rouge : on peut bloquer le merge
# (Settings > Branches > "Require status checks to pass").
# ============================================================================

# Nom affiché dans l'onglet "Actions" de GitHub
name: CI

# Déclencheurs ("on") : quand ce workflow démarre
on:
  pull_request:          # à l'ouverture et à chaque mise à jour d'une PR
  push:
    branches: [main]     # et quand du code arrive sur main

# Principe du moindre privilège : ce workflow a seulement le droit de LIRE le dépôt.
permissions:
  contents: read

# Si on pousse deux fois de suite sur la même branche, on annule l'ancien run
# (inutile de tester un commit déjà dépassé).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Job 1 : l'API (lint + tests unitaires + tests d'intégration) ----
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest      # machine virtuelle fournie par GitHub

    # Un "service container" : GitHub démarre un conteneur Postgres à côté du job,
    # exactement comme le service "db" de notre compose.yaml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432            # accessible sur localhost:5432 depuis le job
        # Le job ne démarre les steps qu'une fois la base prête
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Toutes les commandes `run:` de ce job s'exécutent dans le dossier api/
    defaults:
      run:
        working-directory: api

    # DATABASE_URL défini => le test d'intégration (db.int.test.js) n'est plus ignoré
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow

    steps:
      # Récupère le code du dépôt sur la machine du job
      - uses: actions/checkout@v4

      # Installe Node 20 et met en cache le dossier npm (installations plus rapides)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      # `npm ci` = installation exacte d'après package-lock.json (reproductible)
      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests (unitaires + intégration)
        run: npm test

  # ---------- Job 2 : le front (lint + tests + build) ------------------------
  # Les jobs sans `needs:` s'exécutent EN PARALLÈLE : api et front tournent en même temps.
  front:
    name: Front (lint + tests + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm test

      # Vérifie que le site compile vraiment (erreur d'import, etc.)
      - name: Build
        run: npm run build

  # ---------- Job 3 : les Dockerfile se construisent-ils ? --------------------
  # On construit les images SANS les publier (push: false) : c'est juste un contrôle.
  docker-build:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: [api, front]          # attend que les deux jobs ci-dessus soient verts
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build de l'image front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: false
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
